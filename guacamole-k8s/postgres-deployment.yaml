apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: guacamole_db
        - name: POSTGRES_USER
          value: guacamole_user
        - name: POSTGRES_PASSWORD
          value: guacamole_password
        ports:
        - containerPort: 5432