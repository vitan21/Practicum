apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      containers:
      - name: guacamole
        image: guacamole/guacamole:1.6.0
        env:
        - name: GUACD_HOSTNAME
          value: guacd

        - name: POSTGRESQL_HOSTNAME
          value: postgres

        - name: POSTGRESQL_DATABASE
          value: guacamole_db

        - name: POSTGRESQL_USER
          value: guacamole_user

        - name: POSTGRESQL_PASSWORD
          value: guacamole_password

        ports:
        - containerPort: 8080