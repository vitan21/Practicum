apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guacamole
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vitan21/Practicum/tree/main/guacamole-k8s
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: guacamole

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true